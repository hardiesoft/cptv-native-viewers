# Builds installers for macOS (universal .pkg), Linux x86_64 (.deb for
# Ubuntu 24.04+/Debian 13, .rpm for Fedora) and Windows x64 (.exe), testing
# each one.
#   - Push a tag like v0.2.0 (matching Cargo.toml's version), or create a
#     release with that tag on GitHub, and the four installers are attached to
#     the release (created if it doesn't exist yet).
#   - Run it by hand (Actions > Release > Run workflow) to get the files as
#     build artifacts without releasing.
#
# Optional macOS signing + notarization (otherwise the .pkg is unsigned and
# users approve it under System Settings > Privacy & Security). Repository
# secrets:
#   MACOS_CERTIFICATES_P12       base64 of a .p12 holding both "Developer ID
#                                Application" and "Developer ID Installer" certs
#   MACOS_CERTIFICATES_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: "2.48.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Work out the version
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="$cargo_version-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tests
        run: cargo test --release
      - name: Import signing certificates
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certs.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" >/dev/null
          # Add ours to the search list, keeping the existing keychains (one per word).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n1)
          pkg=$(security find-identity -v -p basic "$kc" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -n1)
          if [ -z "$app" ] || [ -z "$pkg" ]; then
            echo "::error::Both Developer ID certificates (Application and Installer) are needed"
            exit 1
          fi
          echo "SIGN_APP=$app" >> "$GITHUB_ENV"
          echo "SIGN_PKG=$pkg" >> "$GITHUB_ENV"
      - name: Build installer
        run: ./scripts/package-macos.sh
      - name: Check installer
        run: |
          pkg=$(ls dist/*.pkg)
          pkgutil --check-signature "$pkg" || true
          pkgutil --expand-full "$pkg" "$RUNNER_TEMP/pkg"
          for f in "$RUNNER_TEMP/pkg/plugin.pkg/Payload/Library/Application Support/cptv-native-viewers/plugins/libcptv_plugin.dylib" \
                   "$RUNNER_TEMP/pkg/quicklook.pkg/Payload/Applications/CPTV Quick Look.app/Contents/MacOS/CPTV Quick Look"; do
            archs=$(lipo -archs "$f"); echo "$(basename "$f"): $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$f isn't universal"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error

  linux-deb:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config \
            libvlccore-dev vlc-bin vlc-plugin-base
      - name: Install nfpm
        run: ./scripts/install-nfpm.sh "$NFPM_VERSION"
      - name: Build and test
        run: make test
      - name: Package
        run: make package-linux FORMAT=deb
      - name: Install and check the package
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          sudo apt-get install -y -qq "./$deb"
          cvlc --no-audio --vout=dummy --play-and-exit -vv \
            "$(./scripts/fixtures-dir.sh)/20240507-074536.cptv" 2>&1 | grep 'using demux module "cptv"'
          /usr/bin/cptv-thumbnailer -s 128 "$(./scripts/fixtures-dir.sh)/20240507-074536.cptv" "$RUNNER_TEMP/t.png"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  linux-rpm:
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:42
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Dependencies
        run: |
          dnf -y -q install gcc make git curl tar gzip findutils which util-linux \
            pkgconf-pkg-config vlc-devel vlc-cli vlc-plugins-base
      - uses: actions/checkout@v4
      # VLC refuses to run as root (the container's user), so build and test as
      # an ordinary user.
      - name: Build user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c 'curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal'
      - name: Install nfpm
        run: ./scripts/install-nfpm.sh "$NFPM_VERSION"
      # Single quotes: $HOME is the builder's, expanded in its shell.
      - name: Build, test and package
        run: |
          # shellcheck disable=SC2016
          su builder -c '. "$HOME/.cargo/env" && VERSION="'"$VERSION"'" make test package-linux FORMAT=rpm'
      - name: Install and check the package
        run: |
          rpm=$(ls dist/*.rpm)
          rpm -qip "$rpm"
          dnf -y -q install "./$rpm"
          # shellcheck disable=SC2016
          fixtures=$(su builder -c '. "$HOME/.cargo/env" && ./scripts/fixtures-dir.sh')
          su builder -c "cvlc --no-audio --vout=dummy --play-and-exit -vv '$fixtures/20240507-074536.cptv' 2>&1" \
            | grep 'using demux module "cptv"'
          /usr/bin/cptv-thumbnailer -s 128 "$fixtures/20240507-074536.cptv" /tmp/t.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # Windows x64: cross-built on Linux with MinGW-w64 (VLC itself is built that
  # way), then packaged and tested on a real Windows runner.
  windows-build:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 p7zip-full
      - name: Build
        run: ./scripts/package-windows.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/*.dll
            build/windows/*.exe
          if-no-files-found: error

  windows:
    needs: [version, windows-build]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VLC_EXE_SHA256: 20ad191348684b470ddc4e05204316f3d8e39655f412b3e392a0eef97639daaf
      # Sample clips, from the cptv-tools commit pinned in Cargo.toml.
      FIXTURES: https://raw.githubusercontent.com/TheCacophonyProject/cptv-tools/07e68ff5edf491bfea11cc72f0575358076de125/cptv-codec-rs/tests/fixtures
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/windows
      - name: Build installer
        run: |
          # The runner image may already have Inno Setup 6; install it if not.
          $places = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          if (-not ($places | Where-Object { Test-Path $_ })) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = $places | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DBuildDir=$PWD\build\windows" "/DOutDir=$PWD\dist" `
            packaging\windows\cptv-native-viewers.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: Install VLC 3.0.23
        run: |
          $exe = "$env:RUNNER_TEMP\vlc.exe"
          Invoke-WebRequest https://get.videolan.org/vlc/3.0.23/win64/vlc-3.0.23-win64.exe -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:VLC_EXE_SHA256) { throw "VLC installer checksum mismatch" }
          Start-Process $exe -ArgumentList '/S' -Wait
          Get-Item "$env:ProgramFiles\VideoLAN\VLC\vlc.exe"
      - name: Install CPTV Native Viewers
        run: |
          $setup = (Get-ChildItem dist\*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait
          Get-Content install.log -Tail 5
          $app = "$env:ProgramFiles\CPTV Native Viewers"
          Get-Item "$app\vlc-plugins\libcptv_plugin.dll", "$app\cptv_thumbnail_handler.dll"
          cmd /c assoc .cptv
          cmd /c ftype CPTVNativeViewers.cptv
          $path = [Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH', 'Machine')
          "VLC_PLUGIN_PATH=$path"
          if ($path -ne "$app\vlc-plugins") { throw "VLC_PLUGIN_PATH not set as expected" }
      - name: Fetch sample clips
        run: |
          New-Item -ItemType Directory samples | Out-Null
          foreach ($f in '20240507-074536.cptv', '20180603-090916.cptv') {
            Invoke-WebRequest "$env:FIXTURES/$f" -OutFile "samples\$f"
          }
      - name: Play in VLC
        run: |
          # Steps don't see machine environment changes, so read the value the
          # installer wrote, as a newly started Explorer/VLC would.
          $env:VLC_PLUGIN_PATH = [Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH', 'Machine')
          foreach ($f in Get-ChildItem samples\*.cptv) {
            $log = "$env:RUNNER_TEMP\vlc-$($f.BaseName).log"
            Start-Process "$env:ProgramFiles\VideoLAN\VLC\vlc.exe" -Wait -ArgumentList `
              '-I','dummy','--no-audio','--vout=dummy','--play-and-exit','--no-qt-privacy-ask',
              '--file-logging',"--logfile=$log",'--log-verbose=2', "`"$($f.FullName)`""
            $hit = Select-String -Path $log -Pattern 'using demux module "cptv"|CPTV:'
            $hit | ForEach-Object { "$($f.Name): $($_.Line)" }
            if (-not ($hit | Where-Object Line -match 'using demux module "cptv"')) {
              Get-Content $log -Tail 40
              throw "VLC didn't use the cptv demuxer for $($f.Name)"
            }
          }
      - name: Thumbnails
        run: |
          $handler = "$env:ProgramFiles\CPTV Native Viewers\cptv_thumbnail_handler.dll"
          $test = "build\windows\cptv-thumbnail-test.exe"
          New-Item -ItemType Directory thumbs | Out-Null
          foreach ($f in Get-ChildItem samples\*.cptv) {
            # The installed DLL, called directly.
            & $test direct $handler $f.FullName 256 "thumbs\$($f.BaseName)-direct.bmp"
            if ($LASTEXITCODE) { throw "direct thumbnail failed for $($f.Name)" }
            # Windows' own thumbnail pipeline (registration, isolated host process).
            & $test shell $f.FullName 256 "thumbs\$($f.BaseName)-shell.bmp"
            if ($LASTEXITCODE) { throw "shell thumbnail failed for $($f.Name)" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-thumbnails
          path: thumbs/
      - name: Uninstall
        run: |
          $app = "$env:ProgramFiles\CPTV Native Viewers"
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if ([Environment]::GetEnvironmentVariable('VLC_PLUGIN_PATH', 'Machine')) { throw "VLC_PLUGIN_PATH left behind" }
          if (Test-Path 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\{FBF13CFA-0D80-4899-926E-C50711CDFA5A}') { throw "handler CLSID left behind" }
          if (Test-Path 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\CPTVNativeViewers.cptv') { throw "ProgID left behind" }
          if (Test-Path "$app\vlc-plugins\libcptv_plugin.dll") { throw "plugin left behind" }
          "Uninstalled cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux-deb, linux-rpm, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release may already exist: creating one on GitHub also pushes its
      # tag, which is what started this run. Then just attach the files
      # (replacing any from an earlier run), keeping its title and notes.
      - name: Create release or attach files
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: CPTV Native Viewers ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --generate-notes
          fi
