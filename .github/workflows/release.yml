# Builds installers for macOS (universal .pkg) and Linux x86_64 (.deb for
# Ubuntu 24.04+/Debian 13, .rpm for Fedora), testing each one.
#   - Push a tag like v0.2.0 (matching Cargo.toml's version) to publish a
#     GitHub Release with the three files.
#   - Run it by hand (Actions > Release > Run workflow) to get the files as
#     build artifacts without releasing.
#
# Optional macOS signing + notarization (otherwise the .pkg is unsigned and
# users approve it under System Settings > Privacy & Security). Repository
# secrets:
#   MACOS_CERTIFICATES_P12       base64 of a .p12 holding both "Developer ID
#                                Application" and "Developer ID Installer" certs
#   MACOS_CERTIFICATES_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: "2.48.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Work out the version
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
              exit 1
            fi
          else
            version="$cargo_version-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tests
        run: cargo test --release
      - name: Import signing certificates
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certs.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" >/dev/null
          # Add ours to the search list, keeping the existing keychains (one per word).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n1)
          pkg=$(security find-identity -v -p basic "$kc" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -n1)
          if [ -z "$app" ] || [ -z "$pkg" ]; then
            echo "::error::Both Developer ID certificates (Application and Installer) are needed"
            exit 1
          fi
          echo "SIGN_APP=$app" >> "$GITHUB_ENV"
          echo "SIGN_PKG=$pkg" >> "$GITHUB_ENV"
      - name: Build installer
        run: ./scripts/package-macos.sh
      - name: Check installer
        run: |
          pkg=$(ls dist/*.pkg)
          pkgutil --check-signature "$pkg" || true
          pkgutil --expand-full "$pkg" "$RUNNER_TEMP/pkg"
          for f in "$RUNNER_TEMP/pkg/plugin.pkg/Payload/Library/Application Support/cptv-native-viewers/plugins/libcptv_plugin.dylib" \
                   "$RUNNER_TEMP/pkg/quicklook.pkg/Payload/Applications/CPTV Quick Look.app/Contents/MacOS/CPTV Quick Look"; do
            archs=$(lipo -archs "$f"); echo "$(basename "$f"): $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$f isn't universal"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error

  linux-deb:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config \
            libvlccore-dev vlc-bin vlc-plugin-base
      - name: Install nfpm
        run: ./scripts/install-nfpm.sh "$NFPM_VERSION"
      - name: Build and test
        run: make test
      - name: Package
        run: make package-linux FORMAT=deb
      - name: Install and check the package
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb --info "$deb"
          sudo apt-get install -y -qq "./$deb"
          cvlc --no-audio --vout=dummy --play-and-exit -vv \
            "$(./scripts/fixtures-dir.sh)/20240507-074536.cptv" 2>&1 | grep 'using demux module "cptv"'
          /usr/bin/cptv-thumbnailer -s 128 "$(./scripts/fixtures-dir.sh)/20240507-074536.cptv" "$RUNNER_TEMP/t.png"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  linux-rpm:
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:42
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Dependencies
        run: |
          dnf -y -q install gcc make git curl tar gzip findutils which util-linux \
            pkgconf-pkg-config vlc-devel vlc-cli vlc-plugins-base
      - uses: actions/checkout@v4
      # VLC refuses to run as root (the container's user), so build and test as
      # an ordinary user.
      - name: Build user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c 'curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal'
      - name: Install nfpm
        run: ./scripts/install-nfpm.sh "$NFPM_VERSION"
      # Single quotes: $HOME is the builder's, expanded in its shell.
      - name: Build, test and package
        run: |
          # shellcheck disable=SC2016
          su builder -c '. "$HOME/.cargo/env" && VERSION="'"$VERSION"'" make test package-linux FORMAT=rpm'
      - name: Install and check the package
        run: |
          rpm=$(ls dist/*.rpm)
          rpm -qip "$rpm"
          dnf -y -q install "./$rpm"
          # shellcheck disable=SC2016
          fixtures=$(su builder -c '. "$HOME/.cargo/env" && ./scripts/fixtures-dir.sh')
          su builder -c "cvlc --no-audio --vout=dummy --play-and-exit -vv '$fixtures/20240507-074536.cptv' 2>&1" \
            | grep 'using demux module "cptv"'
          /usr/bin/cptv-thumbnailer -s 128 "$fixtures/20240507-074536.cptv" /tmp/t.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux-deb, linux-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "CPTV Native Viewers ${{ needs.version.outputs.version }}" --generate-notes
